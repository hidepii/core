<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="robots" content="noindex, nofollow">

<title>Page Not Found | hidePII</title>

<style>
    :root {
        --bg-color: #fafafa;
        --card-bg: #ffffff;
        --border-color: #e5e7eb;
        --primary-color: #dc2626;
        --text-main: #111827;
        --text-muted: #4b5563;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: system-ui, -apple-system, sans-serif;
    }

    html {
        -webkit-text-size-adjust: 100%;
    }

    body {
        background: var(--bg-color);
        color: var(--text-main);

        min-height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 20px;

        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;

        overflow-x: hidden;
    }


    /* =========================
       BACKGROUND ORBS
       ========================= */

    .glow-orb {
        position: fixed;

        width: 280px;
        height: 280px;

        border-radius: 50%;

        filter: blur(80px);

        pointer-events: none;

        z-index: 0;
    }

    .orb-1 {
        top: -80px;
        left: -80px;

        background: rgba(220, 38, 38, 0.04);
    }

    .orb-2 {
        bottom: -80px;
        right: -80px;

        background: rgba(185, 28, 28, 0.03);
    }


    /* =========================
       ERROR CARD
       ========================= */

    .error-card {
        width: 100%;
        max-width: 500px;

        background: var(--card-bg);

        border: 1px solid var(--border-color);

        border-radius: 12px;

        padding: 42px 30px;

        text-align: center;

        position: relative;

        z-index: 1;

        box-shadow:
            0 1px 2px rgba(0, 0, 0, 0.025);
    }


    /* =========================
       BRAND
       ========================= */

    .brand-name {
        display: inline-block;

        color: var(--text-main);

        font-size: 2.2rem;

        font-weight: 700;

        letter-spacing: -1px;

        line-height: 1;

        margin-bottom: 24px;
    }

    .highlight {
        color: var(--primary-color);
    }


    /* =========================
       CONTENT
       ========================= */

    .error-card h1 {
        color: var(--text-main);

        font-size: 1.35rem;

        line-height: 1.3;

        font-weight: 650;

        margin-bottom: 9px;
    }

    .error-card p {
        max-width: 400px;

        margin: 0 auto;

        color: var(--text-muted);

        font-size: 0.84rem;

        line-height: 1.55;
    }


    /* =========================
       HOME BUTTON
       ========================= */

    .home-link {
        display: inline-flex;

        align-items: center;
        justify-content: center;

        margin-top: 24px;

        min-height: 38px;

        padding: 9px 17px;

        border-radius: 7px;

        background: var(--primary-color);

        border: 1px solid var(--primary-color);

        color: #ffffff;

        text-decoration: none;

        font-size: 0.82rem;

        font-weight: 600;

        transition:
            background-color 0.2s ease,
            border-color 0.2s ease,
            transform 0.2s ease,
            box-shadow 0.2s ease;
    }

    .home-link:hover {
        background: #b91c1c;

        border-color: #b91c1c;

        transform: translateY(-1px);

        box-shadow:
            0 4px 12px rgba(220, 38, 38, 0.16);
    }

    .arrow {
        margin-right: 7px;

        font-size: 0.9rem;
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 640px) {

        body {
            padding: 12px;
        }

        .error-card {
            padding: 34px 20px;

            border-radius: 10px;
        }

        .brand-name {
            font-size: 1.8rem;

            margin-bottom: 21px;
        }

        .error-card h1 {
            font-size: 1.15rem;
        }

        .error-card p {
            font-size: 0.77rem;
        }

        .home-link {
            font-size: 0.77rem;

            padding: 8px 15px;
        }
    }
</style>

</head><body><div class="glow-orb orb-1"></div>
<div class="glow-orb orb-2"></div>


<main class="error-card">

    <div class="brand-name" aria-label="hidePII">
        hide<span class="highlight"> PII</span>
    </div>


    <h1>
        Page Not Found
    </h1>


    <p>
        The page you're looking for doesn't exist,
        may have been moved, or the URL may be incorrect.
    </p>


    <a
        href="/"
        class="home-link"
    >
        <span class="arrow">←</span>
        Back to hidePII
    </a>

</main>

</body>
</html>
