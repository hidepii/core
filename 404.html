<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="robots" content="noindex, nofollow">

    <title>404 — Page Not Found | hidePII</title>

    <style>
        :root {
            --bg-color: #fafafa;
            --card-bg: #ffffff;
            --border-color: #e5e7eb;

            --primary-color: #dc2626;
            --primary-light: #fef2f2;
            --primary-border: #fee2e2;

            --text-main: #111827;
            --text-muted: #4b5563;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px 16px;

            background: var(--bg-color);
            color: var(--text-main);

            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;

            overflow-x: hidden;
        }


        /* ==========================================
           BACKGROUND
           ========================================== */

        .glow-orb {
            position: fixed;

            width: 280px;
            height: 280px;

            border-radius: 50%;

            filter: blur(80px);

            pointer-events: none;

            z-index: 0;
        }

        .orb-1 {
            top: -80px;
            left: -80px;

            background: rgba(220, 38, 38, 0.04);
        }

        .orb-2 {
            right: -80px;
            bottom: -80px;

            background: rgba(185, 28, 28, 0.03);
        }


        /* ==========================================
           MESSAGE CARD
           ========================================== */

        .message-card {
            width: 100%;
            max-width: 460px;

            background: var(--card-bg);

            border: 1px solid var(--border-color);

            border-radius: 10px;

            padding: 30px 28px;

            position: relative;

            z-index: 1;

            box-shadow:
                0 1px 2px rgba(0, 0, 0, 0.025);
        }


        /* ==========================================
           BRAND + 404
           ========================================== */

        .brand-row {
            display: flex;

            align-items: center;

            gap: 9px;

            margin-bottom: 20px;
        }

        .brand-name {
            display: inline-block;

            color: var(--text-main);

            font-size: 1.3rem;

            font-weight: 700;

            letter-spacing: -0.4px;

            line-height: 1;
        }

        .highlight {
            color: var(--primary-color);
        }


        /* ==========================================
           ERROR STATUS
           ========================================== */

        .error-status {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            padding: 3px 6px;

            border-radius: 4px;

            background: var(--primary-light);

            border: 1px solid var(--primary-border);

            color: var(--primary-color);

            font-size: 0.62rem;

            font-weight: 700;

            line-height: 1;

            letter-spacing: 0.15px;
        }


        /* ==========================================
           TITLE
           ========================================== */

        .message-title {
            color: var(--text-main);

            font-size: 1.12rem;

            font-weight: 650;

            line-height: 1.3;

            margin-bottom: 7px;
        }


        /* ==========================================
           DESCRIPTION
           ========================================== */

        .message-text {
            color: var(--text-muted);

            font-size: 0.79rem;

            line-height: 1.55;

            max-width: 390px;
        }


        /* ==========================================
           ACTION
           ========================================== */

        .message-action {
            margin-top: 21px;
        }

        .home-link {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            min-height: 36px;

            padding: 8px 14px;

            border-radius: 7px;

            background: var(--primary-color);

            border: 1px solid var(--primary-color);

            color: #ffffff;

            text-decoration: none;

            font-size: 0.77rem;

            font-weight: 600;

            transition:
                background-color 0.2s ease,
                border-color 0.2s ease,
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .home-link:hover {
            background: #b91c1c;

            border-color: #b91c1c;

            transform: translateY(-1px);

            box-shadow:
                0 4px 12px rgba(220, 38, 38, 0.15);
        }

        .arrow {
            margin-right: 7px;

            font-size: 0.82rem;
        }


        /* ==========================================
           MOBILE
           ========================================== */

        @media (max-width: 480px) {

            body {
                padding: 14px 12px;
            }

            .message-card {
                max-width: 100%;

                padding: 25px 20px;

                border-radius: 9px;
            }

            .brand-row {
                gap: 8px;

                margin-bottom: 17px;
            }

            .brand-name {
                font-size: 1.18rem;
            }

            .error-status {
                font-size: 0.58rem;

                padding: 3px 5px;

                border-radius: 4px;
            }

            .message-title {
                font-size: 0.98rem;

                margin-bottom: 6px;
            }

            .message-text {
                font-size: 0.74rem;

                line-height: 1.5;
            }

            .message-action {
                margin-top: 18px;
            }

            .home-link {
                min-height: 35px;

                padding: 7px 13px;

                font-size: 0.73rem;
            }
        }
    </style>
</head>

<body>

    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>


    <main class="message-card">

        <!-- Branding + 404 -->
        <div class="brand-row">

            <div class="brand-name">
                hide<span class="highlight"> PII</span>
            </div>

            <div class="error-status">
                404
            </div>

        </div>


        <!-- Message -->
        <h1 class="message-title">
            Page Not Found
        </h1>

        <p class="message-text">
            The page you're looking for doesn't exist,
            may have been moved, or the URL may be incorrect.
        </p>


        <!-- Action -->
        <div class="message-action">

            <a
                href="/"
                class="home-link"
                aria-label="Back to hidePII homepage"
            >
                <span class="arrow">←</span>
                Back to hidePII
            </a>

        </div>

    </main>

</body>
</html>
